version: 2

# Used for local releases or a future CI switch. Today, GitHub Actions uses
# .github/workflows/release.yml with explicit go build + names install.sh expects.
#
# Homebrew: the tap is updated by release CI via scripts/push-homebrew-tap.sh + HOMEBREW_TAP_TOKEN.
# Optional GoReleaser brews block (below) is not used in CI today; keep this file for local archives/changelog.

builds:
  - id: aeroform
    main: .
    binary: aeroform
    ldflags:
      - -s -w
      - -X github.com/momo-s15/aeroform/cmd.Version={{.Version}}
      - -X github.com/momo-s15/aeroform/cmd.Commit={{.ShortCommit}}
      - -X github.com/momo-s15/aeroform/cmd.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "aeroform_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
