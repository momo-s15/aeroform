version: 2

builds:
  - id: aeroform
    main: .
    binary: aeroform
    ldflags:
      - -s -w
      - -X github.com/momo-s15/aeroform/cmd.Version={{.Version}}
      - -X github.com/momo-s15/aeroform/cmd.Commit={{.ShortCommit}}
      - -X github.com/momo-s15/aeroform/cmd.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "aeroform_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
