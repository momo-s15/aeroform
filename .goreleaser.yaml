version: 2

# Used for local releases or a future CI switch. Today, GitHub Actions uses
# .github/workflows/release.yml with explicit go build + names install.sh expects.
#
# Homebrew (v1.1.0+): create tap repo (e.g. momo-s15/homebrew-aeroform), then add:
# brews:
#   - repository:
#       owner: momo-s15
#       name: homebrew-aeroform
#     homepage: https://github.com/momo-s15/aeroform
#     description: CLI for natural-language cloud infrastructure
#     ...
# and run goreleaser release from CI with a token that can push to the tap.

builds:
  - id: aeroform
    main: .
    binary: aeroform
    ldflags:
      - -s -w
      - -X github.com/momo-s15/aeroform/cmd.Version={{.Version}}
      - -X github.com/momo-s15/aeroform/cmd.Commit={{.ShortCommit}}
      - -X github.com/momo-s15/aeroform/cmd.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "aeroform_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
