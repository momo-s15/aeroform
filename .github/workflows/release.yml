name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          MODULE: github.com/momo-s15/aeroform
        run: |
          LDFLAGS="-s -w -X ${MODULE}/cmd.Version=${VERSION#v} -X ${MODULE}/cmd.Commit=${COMMIT::7} -X ${MODULE}/cmd.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/aeroform-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/aeroform-linux-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/aeroform-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/aeroform-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/aeroform-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/aeroform-windows-arm64.exe .

      - name: SHA256 checksums
        run: cd dist && sha256sum aeroform-* > checksums.txt

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      # Do not use secrets.* in step `if:` — actionlint/IDE schema flags it; guard in shell instead.
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AEROFORM_TAG: ${{ github.ref_name }}
          CHECKSUMS_FILE: dist/checksums.txt
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping Homebrew tap update."
            exit 0
          fi
          bash scripts/push-homebrew-tap.sh
