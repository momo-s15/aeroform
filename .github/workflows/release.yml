name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/aeroform-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o dist/aeroform-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o dist/aeroform-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o dist/aeroform-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -o dist/aeroform-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -o dist/aeroform-windows-arm64.exe .

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
